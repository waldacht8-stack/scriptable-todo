# 正式アプリ版のビルド（Mac を持たずに GitHub の macOS 環境で行う）
# 1. XcodeGen で Xcode プロジェクトを作る
# 2. シミュレーター用にビルドして起動し、画面のスクリーンショットを撮る（見た目の確認用）
# 3. 実機用に署名なしでビルドし、App Group などの情報だけ ldid で付けて IPA にする（署名は SideStore が行う）
# 4. IPA とスクリーンショットを成果物に、IPA をリリース「ios-latest」に置く（iPhone の Safari から直接ダウンロードできる）
name: iOS app

on:
  push:
    branches: ["**"]   # エージェントの作業ブランチでもビルドして確かめる（リリースは main のみ）
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: write

# 同じブランチで新しいビルドが始まったら古いものは止める（リリースの差し替えがぶつからないように）
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 75   # 画面写真が増えたので（45分では IPA を作る前に打ち切られた）
    defaults:
      run:
        working-directory: ios
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Xcode を選ぶ（いちばん新しいもの）
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: 道具を入れる
        run: brew install xcodegen ldid

      - name: アイコンを描く
        run: swift Tools/MakeIcon.swift App/Assets.xcassets/AppIcon.appiconset/icon.png

      - name: Xcode プロジェクトを作る
        run: xcodegen generate

      - name: シミュレーター用にビルド
        run: |
          set +e
          xcodebuild -project TodoApp.xcodeproj -scheme TodoApp -sdk iphonesimulator \
            -configuration Debug -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO build > sim.log 2>&1
          code=$?
          grep -E "error:" sim.log | sort -u | head -60   # エラー行はすべて見えるように
          tail -5 sim.log
          exit $code

      - name: 単体テスト（シミュレーター）
        run: |
          set +e
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print([x['udid'] for r,v in sorted(d.items()) if 'iOS' in r for x in v if x['name'].startswith('iPhone')][-1])")
          # TEST_RUNNER_TZ → テストを動かすアプリに TZ=Asia/Tokyo を渡す（日付の判定を日本時間で固定）
          TEST_RUNNER_TZ=Asia/Tokyo xcodebuild test -project TodoApp.xcodeproj -scheme TodoApp \
            -destination "platform=iOS Simulator,id=$UDID" -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO > test.log 2>&1
          code=$?
          echo "---- コンパイルエラー ----"
          grep -E "error:" test.log | grep -v "XCTAssert\|XCTUnwrap\|XCTFail" | sort -u | head -60
          echo "---- 失敗したテスト ----"
          grep -E "error: -\[|Test Case .* failed" test.log | sort -u | head -80
          echo "---- 既知の不具合（XCTExpectFailure） ----"
          grep -iE "expected failure" test.log | sort -u | head -40
          echo "---- 結果 ----"
          grep -E "Executed [0-9]+ test" test.log | tail -3
          tail -5 test.log
          # 次の手順（スクリーンショット）が同じシミュレーターを起動できるよう止めておく
          xcrun simctl shutdown "$UDID" 2>/dev/null || true
          exit $code

      - name: シミュレーターで起動してスクリーンショット
        run: |
          mkdir -p shots
          cp App/Assets.xcassets/AppIcon.appiconset/icon.png shots/icon.png
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print([x['udid'] for r,v in sorted(d.items()) if 'iOS' in r for x in v if x['name'].startswith('iPhone')][-1])")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          APP=$(find build/sim -name 'TodoApp.app' -type d | head -1)
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl ui "$UDID" appearance light
          # 起動して撮る。真っ白（小さいファイル）なら、待って撮り直す（遅いシミュレーター対策）
          # 担当の枝では、SHOTS_ON_BRANCH に名前が合う写真だけ撮る（時間短縮）。main ではすべて撮る
          # 各担当は自分の枝でこの値に自分の写真の名前（正規表現）を足す。例："kakeibo|tab-2"
          SHOTS_ON_BRANCH="tab-|home-focus"
          shot() {
            out=$1; shift
            if [ "$GITHUB_REF_NAME" != "main" ] && ! echo "$out" | grep -qE "$SHOTS_ON_BRANCH"; then
              echo "skip $out (branch)"; return 0
            fi
            xcrun simctl terminate "$UDID" com.todoapp.TodoApp 2>/dev/null || true
            sleep 2
            SIMCTL_CHILD_TZ=Asia/Tokyo xcrun simctl launch "$UDID" com.todoapp.TodoApp "$@" -AppleLanguages "(ja)" -AppleLocale ja_JP
            for i in 1 2 3 4 5 6; do
              sleep 8
              xcrun simctl io "$UDID" screenshot "$out"
              size=$(wc -c < "$out")
              [ "$size" -gt 40000 ] && return 0
              echo "blank shot $out ($size bytes), retry $i"
              if [ "$i" = 3 ]; then
                # 動いているか・固まっているかを記録してから、起動し直す
                xcrun simctl spawn "$UDID" launchctl list | grep -i todoapp || echo "diag: TodoApp is not running"
                xcrun simctl spawn "$UDID" log show --last 40s --style compact --predicate 'process == "TodoApp"' 2>/dev/null | tail -15 | sed 's/^/diag: /'
                xcrun simctl terminate "$UDID" com.todoapp.TodoApp 2>/dev/null || true
                sleep 3
                SIMCTL_CHILD_TZ=Asia/Tokyo xcrun simctl launch "$UDID" com.todoapp.TodoApp "$@" -AppleLanguages "(ja)" -AppleLocale ja_JP
              fi
            done
          }
          # カレンダーの許可の確認が写真に重ならないよう、先に許可しておく
          xcrun simctl privacy "$UDID" grant calendar com.todoapp.TodoApp || true
          # ウィジェットの見本（構成 × 大きさ × 色合い）
          shot shots/widgets.png -demo -widgetpreview -theme focus
          shot shots/widgets-large.png -demo -widgetpreview -widgetsize large -theme night
          # 「今日」の4つの構成（色合いを組み合わせて）
          for combo in focus:focus board:night thumb:dawn timeline:paper; do
            layout=${combo%%:*}; theme=${combo##*:}
            shot "shots/home-$layout-$theme.png" -demo -layout $layout -theme $theme -tab 0
          done
          # 完了済みの一覧・元に戻す・編集
          shot shots/done-list.png -demo -layout board -theme focus -tab 0 -donelist
          shot shots/undo.png -demo -layout board -theme focus -tab 0 -shotundo
          shot shots/edit.png -demo -layout board -theme focus -tab 0 -shotedit
          # リリース3（TODO）：新しい構成・完了の表示・追加画面・ウィジェットの見本・件数が多いとき
          shot shots/home-kanban-dawn.png -demo -layout kanban -theme dawn -tab 0
          shot shots/home-checklist-paper.png -demo -layout checklist -theme paper -tab 0 -showdone
          shot shots/home-checklist-many-night.png -demo -demomany -layout checklist -theme night -tab 0
          shot shots/home-focus-showdone.png -demo -layout focus -theme focus -tab 0 -showdone
          shot shots/home-board-showdone.png -demo -layout board -theme night -tab 0 -showdone
          shot shots/home-thumb-showdone.png -demo -layout thumb -theme focus -tab 0 -showdone
          shot shots/home-timeline-many.png -demo -demomany -layout timeline -theme dawn -tab 0 -showdone
          shot shots/add-focus.png -demo -layout focus -theme focus -tab 0 -shotadd
          shot shots/add-night.png -demo -layout kanban -theme night -tab 0 -shotadd
          shot shots/edit-paper.png -demo -layout checklist -theme paper -tab 0 -shotedit
          shot shots/todo-widgets.png -demo -theme focus -tab 0 -todowidgets
          shot shots/todo-widgets-night.png -demo -theme night -tab 0 -todowidgets
          # 起床・習慣・集中・情報のタブ（見本データ）
          for tab in 1 2 3 4; do
            shot "shots/tab-$tab.png" -demo -theme focus -tab $tab
          done
          # 起床の時間帯（起床前・起床中・夜）と、起床の設定・記録
          shot shots/wake-before.png -demo -theme focus -tab 1 -wakePhase before
          shot shots/wake-window.png -demo -theme dawn -tab 1 -wakePhase window
          shot shots/wake-evening.png -demo -theme night -tab 1 -wakePhase evening
          shot shots/wake-settings.png -demo -theme paper -tab 1 -wakeShot settings
          shot shots/wake-records.png -demo -theme focus -tab 1 -wakeShot records
          # 家計簿（見本データ。お店・金額はすべて架空）：ホーム・取り込みの4段・列の対応・手入力・Apple Pay の案内・設定
          shot shots/kakeibo.png -demo -theme focus -tab 2
          shot shots/kakeibo-night.png -demo -theme night -tab 2
          shot shots/kakeibo-world-hinata.png -demo -world hinata -tab 2
          shot shots/kakeibo-add-menu.png -demo -theme focus -tab 2 -kakeiboadd
          shot shots/kakeibo-import.png -demo -theme focus -tab 2 -kakeiboimport source
          shot shots/kakeibo-import-jcb.png -demo -theme focus -tab 2 -kakeiboimport jcb
          shot shots/kakeibo-import-mufg.png -demo -theme focus -tab 2 -kakeiboimport mufg
          shot shots/kakeibo-import-pick.png -demo -theme focus -tab 2 -kakeiboimport pick
          shot shots/kakeibo-import-mapping.png -demo -theme focus -tab 2 -kakeiboimport mapping
          shot shots/kakeibo-import-preview.png -demo -theme focus -tab 2 -kakeiboimport preview
          shot shots/kakeibo-import-done.png -demo -theme focus -tab 2 -kakeiboimport done
          shot shots/kakeibo-import-help.png -demo -theme focus -tab 2 -kakeiboimport help
          shot shots/kakeibo-entry.png -demo -theme focus -tab 2 -kakeiboentry
          shot shots/kakeibo-entry-night.png -demo -theme night -tab 2 -kakeiboentry
          shot shots/kakeibo-applepay.png -demo -theme focus -tab 2 -kakeiboapplepay 1
          shot shots/kakeibo-applepay-send.png -demo -theme focus -tab 2 -kakeiboapplepay 2
          shot shots/kakeibo-applepay-check.png -demo -theme focus -tab 2 -kakeiboapplepay 3
          shot shots/kakeibo-all.png -demo -theme focus -tab 2 -kakeiboall
          shot shots/kakeibo-settings.png -demo -theme focus -tab 2 -kakeibosettings
          # リリース4（TODO・起床）：TODO の見返し（朝・夜と棚卸し・設定・見出しの1行）と、起床の見張り（見張り中・止める画面・夜の確認・二度寝の記録）
          shot shots/review-morning.png -demo -layout focus -theme focus -tab 0 -reviewdemo morning
          shot shots/review-night-weekly.png -demo -layout focus -theme night -tab 0 -reviewdemo night -reviewweekly
          shot shots/review-noon-hinata.png -demo -layout focus -world hinata -tab 0 -reviewdemo noon
          shot shots/review-settings.png -demo -layout board -theme focus -tab 0 -reviewsettings
          shot shots/home-review-line.png -demo -layout board -theme dawn -tab 0
          shot shots/wake-watch.png -demo -theme focus -tab 1 -wakewatchdemo
          shot shots/wake-watch-stop.png -demo -theme dawn -tab 1 -wakewatchstop
          shot shots/wake-evening-check.png -demo -theme focus -tab 1 -wakePhase evening
          shot shots/wake-records-oversleep.png -demo -theme night -tab 1 -wakeShot records
          shot shots/wake-morning-review.png -demo -theme focus -tab 1 -wakePhase after
          # 情報タブ（一覧・ゲーム・ナイト）
          shot shots/info-list.png -demo -theme focus -tab 4 -infolist
          shot shots/info-games.png -demo -theme focus -tab 4 -infogames
          shot shots/info-night.png -demo -theme night -tab 4
          shot shots/info-deck.png -demo -theme focus -tab 4 -infodeck
          # スプラトゥーン3（見本データ。RootView に .splatoonDemoLaunch() が入ると全画面で開く）
          shot shots/splatoon.png -demo -splatdemo
          shot shots/splatoon-records.png -demo -splatdemo -splatscroll records
          # Steam（見本データ）・相談（見本の会話）
          shot shots/steam.png -demo -steamdemo
          shot shots/info-games-steam.png -demo -theme night -tab 4 -infogames
          # Web版 Discord（試作）。-demo では通信せず見本のページを出す
          shot shots/discord-web.png -demo -tab 4 -infogames -discordweb
          shot shots/consult.png -demo -theme focus -tab 3
          shot shots/consult-dawn.png -demo -theme dawn -tab 3
          shot shots/consult-evening.png -demo -theme night -tab 3 -consultevening
          shot shots/consult-stats.png -demo -theme focus -tab 3 -moodstats
          shot shots/consult-stats-night.png -demo -theme night -tab 3 -moodstats -moodscroll weekday
          shot shots/consult-stats-ai.png -demo -theme dawn -tab 3 -moodstats -moodscroll ai
          # リリース4：相談の1日1枚・Discord・第五人格
          shot shots/daycard.png -demo -theme focus -tab 3 -daycard
          shot shots/daycard-night.png -demo -theme night -tab 3 -daycard
          shot shots/daycard-viewer.png -demo -theme focus -tab 3 -daycardviewer
          shot shots/daycard-review.png -demo -theme dawn -tab 3 -daycardviewer -daycardreview
          shot shots/discord.png -demo -theme focus -tab 4 -infogames -discorddemo
          shot shots/discord-setup.png -demo -theme focus -tab 4 -infogames -discorddemo -discordsetup
          shot shots/idv.png -demo -theme focus -tab 4 -infogames -idvdemo
          shot shots/idv-schedule.png -demo -theme focus -tab 4 -infogames -idvdemo -idvscroll schedule
          shot shots/idv-deadlines.png -demo -theme focus -tab 4 -infogames -idvdemo -idvscroll deadlines
          shot shots/info-games-r4.png -demo -theme night -tab 4 -infogames -gamesscroll
          # 世界観（-world。-demo のたびに「なし」へ戻る）
          for world in hinata brutal aurora bento clay swiss; do
            shot "shots/world-$world.png" -demo -layout focus -world $world -tab 0
          done
          shot shots/world-brutal-habit.png -demo -world brutal -tab 2
          shot shots/world-swiss-wake.png -demo -world swiss -tab 1
          shot shots/world-aurora-info.png -demo -world aurora -tab 4
          shot shots/world-clay-checklist.png -demo -layout checklist -world clay -tab 0
          shot shots/world-bento-focus.png -demo -world bento -tab 3
          shot shots/settings-world.png -settings -demo -world hinata -settingsSection world
          # 新しい世界観（地層・銀河・空・霧・深海）：TODO・起床・ウィジェット
          for world in strata galaxy sky mist deepsea; do
            shot "shots/world-$world.png" -demo -world $world
            shot "shots/world-$world-wake.png" -demo -tab 1 -world $world
            shot "shots/widgets-world-$world.png" -demo -widgetpreview -world $world
          done
          shot shots/world-sky-dawn.png -demo -world sky -skyhour 6
          shot shots/world-sky-dusk.png -demo -world sky -skyhour 17
          shot shots/world-sky-night.png -demo -world sky -skyhour 22
          shot shots/widgets-world-sky-night.png -demo -widgetpreview -world sky -skyhour 22
          shot shots/widgets-world-deepsea-other.png -demo -widgetpreview -widgetsize other -world deepsea
          shot shots/settings-world-new.png -settings -demo -world galaxy -settingsSection world
          # ウィジェットの世界観（TODO の小・中・大、起床・習慣・ロック画面）
          for world in hinata brutal aurora bento clay swiss; do
            shot "shots/widgets-world-$world.png" -demo -widgetpreview -world $world
            shot "shots/widgets-world-$world-large.png" -demo -widgetpreview -widgetsize large -world $world
            shot "shots/widgets-world-$world-other.png" -demo -widgetpreview -widgetsize other -world $world
            shot "shots/widgets-world-$world-lock.png" -demo -widgetpreview -widgetsize lock -world $world
          done
          shot shots/widgets-other.png -demo -widgetpreview -widgetsize other -theme focus
          shot shots/widgets-lock.png -demo -widgetpreview -widgetsize lock -theme focus
          # リリース4のウィジェット：太陽と月の一日（3つの時刻）・見返し・今日のまとめ・起床（夜・見張り・スタンバイ）・ロック画面
          shot shots/widgets-r4.png -demo -widgetpreview -widgetsize r4 -theme focus
          shot shots/widgets-r4-sunmoon-0730.png -demo -widgetpreview -widgetsize sunmoon -widgettime 07:30 -theme focus
          shot shots/widgets-r4-sunmoon-1300.png -demo -widgetpreview -widgetsize sunmoon -widgettime 13:00 -theme focus
          shot shots/widgets-r4-sunmoon-2130.png -demo -widgetpreview -widgetsize sunmoon -widgettime 21:30 -theme focus
          shot shots/widgets-r4-sunmoon-1700-hinata.png -demo -widgetpreview -widgetsize sunmoon -widgettime 17:00 -world hinata
          shot shots/widgets-r4-sunmoon-1000-brutal.png -demo -widgetpreview -widgetsize sunmoon -widgettime 10:00 -world brutal
          shot shots/widgets-r4-review.png -demo -widgetpreview -widgetsize review -theme focus
          shot shots/widgets-r4-review-swiss.png -demo -widgetpreview -widgetsize review -world swiss
          shot shots/widgets-r4-summary.png -demo -widgetpreview -widgetsize summary -theme dawn
          shot shots/widgets-r4-summary-brutal.png -demo -widgetpreview -widgetsize summary -world brutal
          shot shots/widgets-r4-summary-clay.png -demo -widgetpreview -widgetsize summary -world clay
          shot shots/widgets-r4-summary-watch.png -demo -widgetpreview -widgetsize summary2 -theme focus
          shot shots/widgets-r4-wake.png -demo -widgetpreview -widgetsize wake4 -theme night
          shot shots/widgets-r4-wake-aurora.png -demo -widgetpreview -widgetsize wake4 -world aurora
          shot shots/widgets-r4-lock.png -demo -widgetpreview -widgetsize lock4 -theme focus
          shot shots/widgets-r4-lock-swiss.png -demo -widgetpreview -widgetsize lock4 -world swiss
          # タブごとのウィジェット（家計簿・相談・情報）：小・中・大とロック画面
          shot shots/widgets-r4-tabs.png -demo -widgetpreview -widgetsize tabs -theme focus
          shot shots/widgets-r4-tabs-bento.png -demo -widgetpreview -widgetsize tabs -world bento
          shot shots/widgets-r4-tabs-night.png -demo -widgetpreview -widgetsize tabs -theme night
          shot shots/widgets-r4-tabslock.png -demo -widgetpreview -widgetsize tabslock -theme focus
          shot shots/widgets-r4-tabslock-brutal.png -demo -widgetpreview -widgetsize tabslock -world brutal
          # 設定画面と「デザインを変える」（-designpage hub|world|theme|layout|tune）。カスタマイズは保存されて残るので、
          # 調整した写真を先に撮り、settings.png で元に戻してから残りを撮る。
          # 設定画面を色合いごとに（暗い色合い・下の見出し・カスタマイズも）。カスタマイズは保存されて残るので最後に。
          # どれも -demo を付ける（付けないと起床のアラーム許可の確認が出て、答えるまで以降の写真にも重なり続ける）
          shot shots/settings-night.png -settings -demo -theme night
          shot shots/design-night.png -settings -demo -theme night -layout board -designpage hub
          shot shots/design-tune-contrast.png -settings -demo -theme contrast -settingsSection custom
          shot shots/settings-ocean.png -settings -demo -theme ocean -settingsSection notify
          shot shots/settings-coffee.png -settings -demo -theme coffee -settingsSection data -density compact
          shot shots/design-sakura.png -settings -demo -theme sakura -layout timeline -designpage hub -accent purple -corner small -font serif -density regular
          shot shots/settings.png -settings -demo -theme focus -accent theme -corner theme -font theme -density regular
          shot shots/design.png -settings -demo -theme focus -layout focus -designpage hub
          shot shots/design-world.png -settings -demo -world hinata -designpage world
          shot shots/design-world-hub.png -settings -demo -world brutal -layout checklist -designpage hub
          shot shots/design-theme.png -settings -demo -theme dawn -layout focus -designpage theme
          shot shots/design-layout.png -settings -demo -theme focus -layout kanban -designpage layout
          shot shots/design-tune.png -settings -demo -theme forest -designpage tune

      - name: 実機用にビルド（署名なし）して IPA を作る
        run: |
          xcodebuild -project TodoApp.xcodeproj -scheme TodoApp -sdk iphoneos \
            -configuration Release -derivedDataPath build/dev \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -40
          APP=$(find build/dev -name 'TodoApp.app' -type d | head -1)
          # SideStore が App Group を登録できるよう、権限（entitlements）だけ付けておく
          ldid -SApp/TodoApp.entitlements "$APP/TodoApp"
          ldid -SWidget/TodoWidget.entitlements "$APP/PlugIns/TodoWidget.appex/TodoWidget"
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qry TodoApp.ipa Payload
          ls -la TodoApp.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: TodoApp
          path: |
            ios/TodoApp.ipa
            ios/shots/*.png

      - name: リリース ios-latest に IPA を置く
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 消して作り直すと、その間リンクが 404 になったり下書きのまま残ったりするので、ファイルの差し替えにする
          if gh release view ios-latest >/dev/null 2>&1; then
            gh release upload ios-latest TodoApp.ipa shots/*.png --clobber
            gh release edit ios-latest --draft=false --prerelease
          else
            gh release create ios-latest TodoApp.ipa shots/*.png --title "アプリ版（最新ビルド）" \
              --notes "GitHub Actions が自動で作ったビルド。iPhone の Safari で TodoApp.ipa をダウンロードし、SideStore で開いてインストール。" --prerelease
          fi
