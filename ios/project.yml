# XcodeGen の設定。GitHub Actions（macOS）で `xcodegen generate` して Xcode プロジェクトを作る。
# 段階0（検証用）：アプリ本体＋ウィジェット。App Group で同じファイルを読み書きできるかを確かめる。
name: TodoApp
options:
  bundleIdPrefix: com.todoapp
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  TodoApp:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: ひより
        UILaunchScreen: {}
        NSAlarmKitUsageDescription: 起床アラームを鳴らすために使います。
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    entitlements:
      path: App/TodoApp.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.todoapp.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.todoapp.TodoApp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: TodoWidget
  TodoWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: ひより
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/TodoWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.todoapp.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.todoapp.TodoApp.TodoWidget
        TARGETED_DEVICE_FAMILY: "1"
