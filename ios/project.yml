# XcodeGen の設定。GitHub Actions（macOS）で `xcodegen generate` して Xcode プロジェクトを作る。
# 段階0（検証用）：アプリ本体＋ウィジェット。App Group で同じファイルを読み書きできるかを確かめる。
name: TodoApp
options:
  bundleIdPrefix: com.todoapp
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  TodoApp:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 日和
        UILaunchScreen: {}
        NSAlarmKitUsageDescription: 起床アラームを鳴らすために使います。
        NSSupportsLiveActivities: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSCalendarsFullAccessUsageDescription: 予定をTODOに取り込み、TODOを予定として登録するために使います。
        NSLocationWhenInUseUsageDescription: 朝のブリーフィングで今いる場所の天気を表示するために使います。
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.todoapp.TodoApp.refresh
    entitlements:
      path: App/TodoApp.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.todoapp.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.todoapp.TodoApp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: TodoWidget
    # テスト（ios/Tests）を xcodebuild test -scheme TodoApp で走らせる
    scheme:
      testTargets:
        - TodoAppTests
  TodoWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: 日和
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/TodoWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.todoapp.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.todoapp.TodoApp.TodoWidget
        TARGETED_DEVICE_FAMILY: "1"
  # 単体テスト（XCTest）。アプリを入れ物にして @testable import TodoApp で Shared の処理を確かめる
  TodoAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: TodoApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.todoapp.TodoAppTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/TodoApp.app/TodoApp
        BUNDLE_LOADER: $(TEST_HOST)
        TARGETED_DEVICE_FAMILY: "1"
